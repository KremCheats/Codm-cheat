name: Build
on:
  push: { branches: [ main ] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true
      - name: Deps
        run: brew install ldid xz make cmake || true
      - name: Theos
        run: |
          [ -d "$HOME/theos" ] || git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          [ -n "$(ls -A "$HOME/theos/sdks" 2>/dev/null)" ] || "$HOME/theos/bin/install-sdk" || true
      - name: Generate
        run: |
          if [ -f write_tree.py ]; then
            python3 write_tree.py
          elif [ -f write-tree.py ]; then
            python3 write-tree.py
          else
            echo "no generator found"; ls -la; exit 1
          fi
      - name: Commit back
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "gen [skip ci]" && git push)
      - name: Dobby
        run: |
          if [ -f vendor/dobby/build/libdobby.a ] && [ -d vendor/dobby/include ]; then
            echo "Dobby already built, skipping."
            exit 0
          fi
          rm -rf vendor/dobby
          git clone --depth 1 --recursive https://github.com/jmpews/Dobby.git /tmp/dobby
          git clone --depth 1 https://github.com/leetal/ios-cmake /tmp/ios-cmake
          mkdir -p /tmp/dobby/build && cd /tmp/dobby/build
          cmake /tmp/dobby \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/ios-cmake/ios.toolchain.cmake \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DPLATFORM=OS64 -DARCHS=arm64 -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DENABLE_BITCODE=0 -DENABLE_ARC=0 -DENABLE_VISIBILITY=1 \
            -DDEPLOYMENT_TARGET=14.0 -DDynamicBinaryInstrument=ON -DNearBranch=ON \
            -DPlugin.SymbolResolver=ON -DPlugin.Darwin.HideLibrary=ON \
            -DPlugin.Darwin.ObjectiveC=ON -DDarwin.GenerateFramework=OFF \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(sysctl -n hw.ncpu)
          mkdir -p "$GITHUB_WORKSPACE/vendor/dobby/build" "$GITHUB_WORKSPACE/vendor/dobby/include"
          cp "$(find /tmp/dobby -name libdobby.a | head -n1)" "$GITHUB_WORKSPACE/vendor/dobby/build/libdobby.a"
          cp -r /tmp/dobby/include/* "$GITHUB_WORKSPACE/vendor/dobby/include/" 2>/dev/null || true
          find "$GITHUB_WORKSPACE/vendor/dobby/include" -type f | head
      - name: Patch Makefile flags
        run: |
          sed -i '' 's|^\(CODMCheat_C[A-Z]*FLAGS =.*\)$|\1 -Wno-module-import-in-extern-c -Wno-error|' Makefile
          grep -E '^CODMCheat_C[A-Z]*FLAGS' Makefile
      - name: Build
        run: make clean || true; make
      - name: Collect
        run: |
          mkdir -p dist
          cp "$(find .theos/obj -name CODMCheat.dylib | head -n1)" dist/CODMCheat.dylib
          lipo -info dist/CODMCheat.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: CODMCheat-dylib
          path: dist/CODMCheat.dylib
          if-no-files-found: error
