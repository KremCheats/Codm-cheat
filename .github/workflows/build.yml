              p_field_get_value(o, f, out);
          }
          void writeFieldRaw(void *o, void *k, const char *n, const void *in, size_t sz) {
              void *f = field(k, n);
              if (!f || !p_field_set_value) return;
              p_field_set_value(o, f, (void *)in);
          }
